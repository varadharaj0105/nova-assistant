name: Screenshots

# Runs the app on an Android emulator with sample photos and publishes screenshots of every
# screen to the "screenshots" pre-release, so the design can be checked without a phone.
on:
  push:
    branches: [main, redesign]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put global hide_error_dialogs 1
            sleep 20 && adb shell input keyevent KEYCODE_HOME
            gradle connectedDebugAndroidTest --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || true
            adb exec-out run-as com.varadha.nova tar c -C files shots > shots.tar
            mkdir -p out && tar xf shots.tar -C out && ls -la out/shots
            adb shell pm grant com.varadha.nova android.permission.RECORD_AUDIO
            adb shell cmd role add-role-holder android.app.role.ASSISTANT com.varadha.nova 0
            adb shell cmd role get-role-holders android.app.role.ASSISTANT
            adb shell input keyevent KEYCODE_HOME && sleep 3
            adb shell input keyevent KEYCODE_ASSIST && sleep 5
            adb exec-out screencap -p > out/shots/z_assist_key.png
            adb shell dumpsys activity activities | grep -m3 -i "mResumedActivity\|topResumedActivity" || true

      - name: Publish screenshots
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screenshots
          name: Screenshots (latest design check)
          prerelease: true
          make_latest: false
          files: out/shots/*.png
